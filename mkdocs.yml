site_name: OmniMail
site_description: Vendor-free Go core for transactional email
site_url: https://plexusone.github.io/omnimail/
repo_url: https://github.com/plexusone/omnimail
repo_name: plexusone/omnimail

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

# docs/guides/ holds the user guides and docs/releases/ the release notes.
# docs/specs/ and docs/design/ join the nav as they gain content.
nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Templates: guides/templates.md
      - SMTP: guides/smtp.md
      - Writing an Adapter: guides/adapters.md
      - Conformance Suite: guides/conformance.md
  - Releases:
      - v0.1.0: releases/v0.1.0.md
      - Changelog: releases/changelog.md
